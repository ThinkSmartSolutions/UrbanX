<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="uxbg" cx="34%" cy="24%" r="95%">
      <stop offset="0" stop-color="#1b2533"/>
      <stop offset="0.55" stop-color="#0b1018"/>
      <stop offset="1" stop-color="#04070c"/>
    </radialGradient>
    <linearGradient id="uxcy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7df0fb"/>
      <stop offset="0.5" stop-color="#34d6ec"/>
      <stop offset="1" stop-color="#16aecb"/>
    </linearGradient>
    <filter id="uxglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- fundal patrat rotunjit, intunecat -->
  <rect width="1024" height="1024" rx="224" fill="url(#uxbg)"/>
  <rect x="7" y="7" width="1010" height="1010" rx="217" fill="none" stroke="#3ad6ea" stroke-opacity="0.16" stroke-width="4"/>
  <!-- marca cyan: X stilizat cu swash inferior (U), cu glow -->
  <g fill="none" stroke="url(#uxcy)" stroke-width="76" stroke-linecap="round" stroke-linejoin="round" filter="url(#uxglow)">
    <!-- diagonala stanga-sus -> dreapta-jos -->
    <path d="M352 320 Q500 472 650 694"/>
    <!-- diagonala dreapta-sus -> stanga-jos -->
    <path d="M674 320 Q524 472 392 636"/>
    <!-- swash inferior (bucla U) care leaga capetele de jos -->
    <path d="M392 636 Q452 768 566 748 Q662 732 650 694"/>
  </g>
</svg>
